/* src/utils/dates.js */
// Date helpers and calendar constants (plain script, exposes globals).

const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]; // the week starts on Monday
const MONTHS = ["January", "February", "March", "April", "May", "June",
  "July", "August", "September", "October", "November", "December"];

const pad2 = (n) => String(n).padStart(2, "0");

// month is 0-based, like Date. Returns "YYYY-MM-DD".
const dateKey = (year, month, day) => `${year}-${pad2(month + 1)}-${pad2(day)}`;

const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();

// 0 (Monday) - 6 (Sunday). Date.getDay() is 0 (Sunday) - 6 (Saturday), so shift it by one.
const firstWeekday = (year, month) => (new Date(year, month, 1).getDay() + 6) % 7;

// Every cell of the month view: leading days from the previous month and trailing
// days from the next one fill out the first and last weeks (always whole weeks).
// Returns [{ key, day, month, outside }], where `month` is 0-based and `outside`
// is true for days that belong to the previous or next month.
function monthGrid(year, month) {
  const lead = firstWeekday(year, month);
  const total = Math.ceil((lead + daysInMonth(year, month)) / 7) * 7;
  return Array.from({ length: total }, (_, i) => {
    const d = new Date(year, month, 1 - lead + i); // Date rolls over month/year boundaries
    return {
      key: dateKey(d.getFullYear(), d.getMonth(), d.getDate()),
      day: d.getDate(),
      month: d.getMonth(),
      outside: d.getMonth() !== month,
    };
  });
}

/* src/utils/storage.js */
// The entries saved in this browser (plain script, exposes globals).
//
// Entries now live in the API. What is left here is what was saved before that: it is only read so it can be
// imported into the API once (see importLocal.js), and removed as it is imported.
// Stored shape: { "YYYY-MM-DD": [{ id, user, project, hours }, ...] }
// One store holds every user's entries; each entry carries the `user` who owns it.
//
// Key history: -v1 held free-text comments (ignored, left untouched); -v2 held
// entries without a user (adopted by the first configured user, see adoptLegacyEntries).

const ENTRIES_STORAGE_KEY = "calendar-entries-v3";
const LEGACY_ENTRIES_STORAGE_KEY = "calendar-entries-v2";

function loadEntries() {
  try {
    const data = JSON.parse(localStorage.getItem(ENTRIES_STORAGE_KEY) || "{}");
    return data && typeof data === "object" ? data : {};
  } catch (e) {
    return {};
  }
}

// An empty object removes the key, so clearing all entries leaves no trace.
function saveEntries(entries) {
  try {
    if (Object.keys(entries).length === 0) {
      localStorage.removeItem(ENTRIES_STORAGE_KEY);
    } else {
      localStorage.setItem(ENTRIES_STORAGE_KEY, JSON.stringify(entries));
    }
  } catch (e) {
    // Storage unavailable or full: keep working in memory.
  }
}

// One-time migration: entries saved before accounts existed (-v2, no user) are
// moved into the current store and assigned to `user`. The old key is removed
// only after the new data was written, so a failure loses nothing.
function adoptLegacyEntries(user) {
  try {
    const legacy = JSON.parse(localStorage.getItem(LEGACY_ENTRIES_STORAGE_KEY) || "null");
    if (!legacy || typeof legacy !== "object") return;

    const all = loadEntries();
    for (const [date, list] of Object.entries(legacy)) {
      if (!Array.isArray(list) || list.length === 0) continue;
      const adopted = list.map((e) => ({ id: e.id, user, project: e.project, hours: e.hours }));
      all[date] = [...(all[date] || []), ...adopted];
    }
    localStorage.setItem(ENTRIES_STORAGE_KEY, JSON.stringify(all));
    localStorage.removeItem(LEGACY_ENTRIES_STORAGE_KEY);
  } catch (e) {
    // Leave the legacy data where it is.
  }
}

  } catch (e) {
    return null;
  }
}

  try { sessionStorage.setItem(VIEW_STORAGE_KEY, JSON.stringify(view)); } catch (e) {}
}

/* src/utils/api.js */
// Talking to the API (plain script, exposes globals).
//
// Every call goes to API_BASE_URL (src/config.js). Once signed in, the bearer token that the API handed
// out is sent on each call. The token is kept in sessionStorage, so it is forgotten when the tab closes.
// Passwords are sent once, to log in, and never stored.

const TOKEN_STORAGE_KEY = "calendar-token-v1"; // sessionStorage

class ApiError extends Error {
  constructor(message, status) {
    super(message);
    this.status = status; // the HTTP status, or 0 when the API could not be reached at all
  }
}

function getToken() {
  try { return sessionStorage.getItem(TOKEN_STORAGE_KEY); } catch (e) { return null; }
}

function setToken(token) {
  try { sessionStorage.setItem(TOKEN_STORAGE_KEY, token); } catch (e) {}
}

function clearToken() {
  try { sessionStorage.removeItem(TOKEN_STORAGE_KEY); } catch (e) {}
}

// Called (once) when the API says the token is no longer good, so the app can go back to the login page.
let unauthorizedHandler = null;
function setUnauthorizedHandler(handler) {
  unauthorizedHandler = handler;
}

// The API's own reason, in words: `detail` is a string, or (for invalid input) a list of field errors.
function describeError(status, detail, response) {
  if (typeof detail === "string") {
    if (status === 429) {
      const wait = response.headers.get("Retry-After");
      return wait ? `${detail} Try again in ${wait} seconds.` : detail;
    }
    return detail;
  }
  if (Array.isArray(detail) && detail.length) {
    return detail.map((d) => `${(d.loc || []).slice(1).join(".") || "input"}: ${d.msg}`).join("; ");
  }
  return status >= 500 ? "The API had an error. Try again." : `The API answered ${status}.`;
}

// Resolves with the parsed JSON (null for "204 No Content") or rejects with an ApiError.
// `auth: false` is for calls that must not carry a token (login).
async function apiRequest(path, { method = "GET", body, auth = true, notifyExpired = true, token = getToken() } = {}) {
  const headers = {};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  if (auth && token) headers["Authorization"] = "Bearer " + token;

  let response;
  try {
    response = await fetch(API_BASE_URL + path, {
      method,
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
    });
  } catch (e) {
    throw new ApiError(`Cannot reach the API at ${API_BASE_URL}. Is it running?`, 0);
  }

  if (response.ok) return response.status === 204 ? null : response.json();

  let detail;
  try { detail = (await response.json()).detail; } catch (e) {}
  if (response.status === 401 && auth && token) {
    clearToken();
    if (notifyExpired && unauthorizedHandler) unauthorizedHandler();
  }
  throw new ApiError(describeError(response.status, detail, response), response.status);
}

// Signs in and remembers the token. Resolves with the signed-in user: { id, username, full_name, role, color, ... }.
async function apiLogin(username, password) {
  const result = await apiRequest("/auth/login", { method: "POST", body: { username, password }, auth: false });
  setToken(result.access_token);
  return result.user;
}

const apiMe = () => apiRequest("/auth/me");

// Everyone's id, username, full_name, color and is_active (nothing private). Open to any signed-in user.
const apiUsers = () => apiRequest("/users/directory");

// The customer-project choices for the entry form: active projects, the signed-in user's favorites first.
const apiProjectOptions = () => apiRequest("/projects/options");

// Entries of the given users (a list of user ids). `from` and `to` are YYYY-MM-DD, both inclusive; up to 5000.
const apiEntries = (from, to, userIds) =>
  apiRequest(`/entries?date_from=${from}&date_to=${to}&${userIds.map((id) => `user_id=${id}`).join("&")}&limit=5000`);
const apiCreateEntry = (body) => apiRequest("/entries", { method: "POST", body });
// `changes` holds only the fields that change: project_id, hours, user_id, ...
const apiUpdateEntry = (id, changes) => apiRequest(`/entries/${id}`, { method: "PATCH", body: changes });
const apiDeleteEntry = (id) => apiRequest(`/entries/${id}`, { method: "DELETE" });
// Deletes ALL of the signed-in user's own entries (never anyone else's).
const apiClearMyEntries = () => apiRequest("/entries?confirm=true", { method: "DELETE" });
// 1 to 500 entries at once, all or none.
const apiCreateEntries = (entries) => apiRequest("/entries/bulk", { method: "POST", body: { entries } });

// Forgets the token at once, then ends the session on the server too.
async function apiLogout() {
  const token = getToken();
  clearToken();
  if (!token) return;
  try {
    await apiRequest("/auth/logout", { method: "POST", token, notifyExpired: false });
  } catch (e) {
    // Already expired, or the API is down: either way there is nothing left to end.
  }
}

    return [];
  }

/* src/utils/importLocal.js */
// One-time move of the entries saved in this browser into the API (plain script, exposes globals).
// Entries used to live only in localStorage (storage.js); this is how they get into the API.

const IMPORT_CHUNK = 500; // the API takes at most 500 entries in one bulk request

const countLocalEntries = () =>
  Object.values(loadEntries()).reduce((n, list) => n + (Array.isArray(list) ? list.length : 0), 0);

// What can be imported right now: { ready: [{ id, payload }], skipped }. An entry needs a project the API still
// offers and an active user; the others are `skipped` and stay in this browser.
// projectIdOf(label) and activeUserIdOf(username) give the API's ids, or undefined.
function planLocalImport({ projectIdOf, activeUserIdOf }) {
  const ready = [];
  let skipped = 0;
  for (const [date, list] of Object.entries(loadEntries())) {
    if (!Array.isArray(list)) continue;
    for (const e of list) {
      const project_id = projectIdOf(e.project);
      const user_id = activeUserIdOf(e.user);
      if (project_id === undefined || user_id === undefined) {
        skipped += 1;
      } else {
        ready.push({ id: e.id, payload: { user_id, project_id, entry_date: date, hours: Number(e.hours) } });
      }
    }
  }
  return { ready, skipped };
}

// Sends the ready entries, each chunk all or none, and removes a chunk from this browser as soon as the API has
// accepted it, so a failure part-way never leads to duplicates. Resolves with how many were imported; rejects
// with the API's error (what was imported before it stays imported).
async function importLocalEntries(plan) {
  let imported = 0;
  for (let i = 0; i < plan.ready.length; i += IMPORT_CHUNK) {
    const chunk = plan.ready.slice(i, i + IMPORT_CHUNK);
    await apiCreateEntries(chunk.map((c) => c.payload));
    const done = new Set(chunk.map((c) => c.id));
    const remaining = {};
    for (const [date, list] of Object.entries(loadEntries())) {
      const kept = list.filter((e) => !done.has(e.id));
      if (kept.length) remaining[date] = kept;
    }
    saveEntries(remaining);
    imported += chunk.length;
  }
  return imported;
}

/* src/hooks/useEntries.js */
// State hook for the calendar's entries, kept in the API (plain script, no JSX).
//
// It loads the entries of the chosen users (`userIds`) for the dates on screen (`from` to `to`, the first and last
// cell of the month grid), and loads again when any of those change. It turns changes into API calls. As in the API,
// signing in only says WHO you are: every entry can be added for, edited or deleted by anyone; only "clear all" is
// limited to your own.
//
// An entry, as the components see it: { id, user (username), userId, project (label), projectId, hours, date }.
// Entries are grouped by date: { "YYYY-MM-DD": [entry, ...] }.
//
// `projectIdOf(label)` and `userIdOf(username)` translate what the form shows into the ids the API wants
// (undefined when unknown). The change functions resolve with { ok: true } or { ok: false, error }, and never throw.

const ENTRIES_LIMIT = 5000; // the most the API returns for one request

const toUiEntry = (e) => ({
  id: e.id,
  user: e.username,
  userId: e.user_id,
  project: e.project_label,
  projectId: e.project_id,
  hours: e.hours,
  date: e.entry_date,
});

// The order the API uses: by user, then by creation.
const byOwnerThenId = (a, b) => a.userId - b.userId || a.id - b.id;

function groupByDate(list) {
  const grouped = {};
  for (const e of list) (grouped[e.date] = grouped[e.date] || []).push(e);
  for (const date of Object.keys(grouped)) grouped[date].sort(byOwnerThenId);
  return grouped;
}

// `entries` without the entry `id` (wherever it is), and with `entry` added when given.
function withEntry(entries, id, entry) {
  const next = {};
  for (const [date, list] of Object.entries(entries)) {
    const kept = list.filter((e) => e.id !== id);
    if (kept.length) next[date] = kept;
  }
  if (entry) next[entry.date] = [...(next[entry.date] || []), entry].sort(byOwnerThenId);
  return next;
}

function useEntries({ from, to, userIds, projectIdOf, userIdOf }) {
  const [state, setState] = React.useState({ entries: {}, status: "loading", error: "", truncated: false });
  const latestRequest = React.useRef(0);

  const usersKey = [...userIds].sort((a, b) => a - b).join(",");   // a value, so a new array with the same ids does not reload

  const load = React.useCallback(async () => {
    const request = ++latestRequest.current;
    if (usersKey === "") {                                         // nobody chosen: nothing to ask for
      setState({ entries: {}, status: "ready", error: "", truncated: false });
      return;
    }
    setState((s) => ({ ...s, status: "loading", error: "" }));
    try {
      const list = await apiEntries(from, to, usersKey.split(","));
      if (request !== latestRequest.current) return; // a newer request has taken over
      setState({ entries: groupByDate(list.map(toUiEntry)), status: "ready", error: "", truncated: list.length >= ENTRIES_LIMIT });
    } catch (e) {
      if (request === latestRequest.current) setState((s) => ({ ...s, status: "error", error: e.message }));
    }
  }, [from, to, usersKey]);

  React.useEffect(() => { load(); }, [load]);

  // Runs an API change; the outcome is a value, so the form can show what went wrong and keep what was typed.
  const attempt = async (change) => {
    try {
      await change();
      return { ok: true };
    } catch (e) {
      return { ok: false, error: e.message };
    }
  };

  const ownerId = (username) => {
    const id = userIdOf(username);
    if (id === undefined) throw new Error(`Unknown user "${username}".`);
    return id;
  };

  const projectId = (label) => {
    const id = projectIdOf(label);
    if (id === undefined) throw new Error("That project is not available any more. Pick another one.");
    return id;
  };

  // `user` is whose entry it is; left out, it is the signed-in user (the API's default).
  const addEntry = (date, { project, hours, user: owner }) => attempt(async () => {
    const body = { project_id: projectId(project), entry_date: date, hours };
    if (owner) body.user_id = ownerId(owner);
    const created = toUiEntry(await apiCreateEntry(body));
    setState((s) => ({ ...s, entries: withEntry(s.entries, created.id, created) }));
  });

  // Only what changed is sent, so an entry on a since-retired project can keep it.
  const updateEntry = (date, id, { project, hours, user: owner }) => attempt(async () => {
    const existing = (state.entries[date] || []).find((e) => e.id === id);
    if (!existing) throw new Error("This entry no longer exists.");
    const changes = {};
    if (project !== existing.project) changes.project_id = projectId(project);
    if (Number(hours) !== existing.hours) changes.hours = Number(hours);
    if (owner && owner !== existing.user) changes.user_id = ownerId(owner);
    if (Object.keys(changes).length === 0) return;
    const updated = toUiEntry(await apiUpdateEntry(id, changes));
    setState((s) => ({ ...s, entries: withEntry(s.entries, id, updated) }));
  });

  const removeEntry = (date, id) => attempt(async () => {
    try {
      await apiDeleteEntry(id);
    } catch (e) {
      if (e.status !== 404) throw e; // already deleted by someone else: it is gone either way
    }
    setState((s) => ({ ...s, entries: withEntry(s.entries, id, null) }));
  });

  // Deletes ALL of the signed-in user's entries (every month), then shows what is left.
  const clearAll = () => attempt(async () => {
    await apiClearMyEntries();
    await load();
  });

  return { ...state, reload: load, addEntry, updateEntry, removeEntry, clearAll };
}
</script>

/* src/hooks/useProjects.js */
// The "Customer - Project" choices, read from the API (plain script, no JSX).
// Only active projects of active customers, the signed-in user's favorites first (GET /projects/options).
// Each project is { id, label, is_favorite, ... }; entries are saved with the label.
//
// Returns { projects, status, error, reload }: status is "loading", "ready" or "error" (error is then the reason).
function useProjects() {
  const [state, setState] = React.useState({ projects: [], status: "loading", error: "" });

  const load = React.useCallback(async () => {
    setState((s) => ({ ...s, status: "loading", error: "" }));
    try {
      setState({ projects: await apiProjectOptions(), status: "ready", error: "" });
    } catch (e) {
      setState({ projects: [], status: "error", error: e.message });
    }
  }, []);

  React.useEffect(() => { load(); }, [load]);

  return { ...state, reload: load };
}
</script>

// Offers to move the entries this browser saved before entries lived in the API into the API.
// Shown only while such entries exist. `ready` is false until the project list and the users have loaded
// (until then nothing could be matched). `onImported` is called after an import, to show the new entries.
function ImportBanner({ ready, projectIdOf, activeUserIdOf, onImported }) {
  const [version, setVersion] = React.useState(0);       // bumped after an import, to read the browser's store again
  const [busy, setBusy] = React.useState(false);
  const [message, setMessage] = React.useState("");
  const [hidden, setHidden] = React.useState(false);

  const total = React.useMemo(countLocalEntries, [version]);
  const plan = React.useMemo(
    () => (ready ? planLocalImport({ projectIdOf, activeUserIdOf }) : { ready: [], skipped: 0 }),
    [version, ready, projectIdOf, activeUserIdOf]);

  if (hidden || (total === 0 && !message)) return null;

  const run = async () => {
    setBusy(true);
    setMessage("");
    let text;
    try {
      const n = await importLocalEntries(plan);
      text = `Imported ${n} ${n === 1 ? "entry" : "entries"} into the API.`;
    } catch (e) {
      text = `The import stopped: ${e.message} Entries already imported are kept in the API; the rest are still saved in this browser.`;
    }
    setBusy(false);
    setMessage(text);
    setVersion((v) => v + 1);
    onImported();
  };

  return (
    <p className="banner import-banner" role="status">
      {total > 0 && (
        <span>
          {total} {total === 1 ? "entry" : "entries"} saved in this browser from before entries moved to the API {total === 1 ? "is" : "are"} not
          in the API yet.{" "}
          {plan.skipped > 0 && `${plan.skipped} cannot be imported (their project is retired, or their user is inactive or unknown) and would stay here. `}
        </span>
      )}
      {message && <span>{message} </span>}
      {total > 0 && (!ready || plan.ready.length > 0) && (
        <button onClick={run} disabled={!ready || busy}>
          {busy ? "Importing…" : ready ? `Import ${plan.ready.length}` : "Import"}
        </button>
      )}
      <button onClick={() => setHidden(true)}>Hide</button>
    </p>
  );

  const defaultOwner = owners.some((o) => o.username === currentUser) ? currentUser : "";
  const [owner, setOwner] = React.useState(defaultOwner);
  const [editingId, setEditingId] = React.useState(null);
  const [busy, setBusy] = React.useState(false);            // an API call is in progress
  const [failure, setFailure] = React.useState("");         // why the last add / change / delete failed
  const [hiddenNote, setHiddenNote] = React.useState("");   // saved, but for a user whose entries are not shown

  const resetEditor = () => {
    setProject(""); setHours(String(DEFAULT_HOURS)); setOwner(defaultOwner); setEditingId(null); setFailure(""); setHiddenNote("");
  };

  // Start with a clean editor whenever a different date is selected.
  React.useEffect(resetEditor, [selectedKey]);

  if (!selectedKey) {
    return (

        <p className="muted">Click a date to add or edit its entries.</p>

  const save = async () => {

    setFailure("");
    const fields = { project, hours: Number(hours), user: owner };
    const result = editingId ? await onUpdate(selectedKey, editingId, fields) : await onAdd(selectedKey, fields);
    setBusy(false);
    if (!result.ok) {
      setFailure(result.error);
      return;

    resetEditor();

    if (!isShown(owner)) {

    const listed = new Set([...listedUsers.map((u) => u.id), ...(isAdmin ? [] : [profile.id])]);

    return kept && (kept.length > 0 || saved.shown.length === 0) ? kept : isAdmin ? [] : [profile.id];

  }, [users, profile]);
  const userOf = (username) => known[String(username).toLowerCase()];
  // The users an entry can be given to: the active ones (the API refuses a deactivated user), administrators left out.
  const owners = React.useMemo(() => {
    const list = listedUsers.filter((u) => u.is_active).map((u) => known[u.username.toLowerCase()]);
    return isAdmin || list.some((o) => o.username === user) ? list : [known[user.toLowerCase()], ...list];
  }, [listedUsers, known, user, isAdmin]);

  // What the form shows -> the ids the API wants (undefined when unknown).
  const projectIdOf = React.useCallback(
    (label) => (catalog.projects.find((p) => p.label === label) || {}).id, [catalog.projects]);
  const userIdOf = React.useCallback((username) => (known[String(username).toLowerCase()] || {}).id, [known]);
  const activeUserIdOf = React.useCallback((username) => {
    const u = known[String(username).toLowerCase()];
    return u && u.active ? u.id : undefined;
  }, [known]);

  // The entries on screen: the first to the last cell of the month grid (adjacent-month days included).
  const [from, to] = React.useMemo(() => {
    const grid = monthGrid(year, month);
    return [grid[0].key, grid[grid.length - 1].key];
  }, [year, month]);
  const entriesState = useEntries({ from, to, userIds: shown, projectIdOf, userIdOf });
  const { addEntry, updateEntry, removeEntry, clearAll } = entriesState;
  // Only the checked users' entries are shown: also right after an entry is added or moved to someone unchecked.
  const isShown = (username) => shown.includes(userIdOf(username));
  const entries = React.useMemo(() => {
    const visible = {};
    for (const [date, list] of Object.entries(entriesState.entries)) {
      const kept = list.filter((e) => shown.includes(e.userId));
      if (kept.length) visible[date] = kept;
    }
    return visible;
  }, [entriesState.entries, shown]);

  const changeMonth = (delta) => {
    const d = new Date(year, month + delta, 1);
    setYear(d.getFullYear());
    setMonth(d.getMonth());
  };

  // Loads what is on screen again, to see what others changed: the entries, and the project choices.
  const refresh = () => {
    entriesState.reload();
    catalog.reload();
  };

  const goToday = () => {
    setYear(now.getFullYear());
    setMonth(now.getMonth());
    setSelected(todayKey);
  };

  const confirmClear = async () => {
    const result = await clearAll();
    setClearError(result.ok ? "" : `Clear data failed: ${result.error}`);
    setSelected(null);
    setConfirmingClear(false);
  };

  return (
    <div className="app">
      <Header
        year={year}
        month={month}
        profile={profile}
        onPrev={() => changeMonth(-1)}
        onToday={goToday}
        onNext={() => changeMonth(1)}
        onRefresh={refresh}
        refreshing={entriesState.status === "loading"}
        onClear={() => setConfirmingClear(true)}
        canClear
        onLogout={onLogout}
      />
      <UserList users={listedUsers} meId={profile.id} shown={shown} onToggle={toggleShown} />
      {shown.length === 0 && (
        <p className="muted banner">No user is checked, so no entries are shown.</p>
      )}
      {catalog.status === "error" && (
        <p className="auth-error banner" role="alert">
          The customer-project list could not be loaded: {catalog.error}{" "}
          <button onClick={catalog.reload}>Retry</button>
        </p>
      )}
      {entriesState.status === "error" && (
        <p className="auth-error banner" role="alert">
          The entries could not be loaded: {entriesState.error}{" "}
          <button onClick={entriesState.reload}>Retry</button>
        </p>
      )}
      {entriesState.truncated && (
        <p className="auth-error banner" role="alert">
          Only the first {ENTRIES_LIMIT} entries of these dates are shown.
        </p>
      )}
      {clearError && (
        <p className="auth-error banner" role="alert">
          {clearError} <button onClick={() => setClearError("")}>Dismiss</button>
        </p>
      )}
      <ImportBanner
        ready={catalog.status === "ready"}
        projectIdOf={projectIdOf}
        activeUserIdOf={activeUserIdOf}
        onImported={entriesState.reload}
      />
      <CalendarGrid
        year={year}
        month={month}
        entries={entries}
        userOf={userOf}
        selected={selected}
        todayKey={todayKey}
        onSelect={setSelected}
      />
      <EntryPanel
        dateKey={selected}
        catalog={catalog}
        owners={owners}
        currentUser={user}
        userOf={userOf}
        isShown={isShown}
        entries={selected ? entries[selected] || [] : []}
        onAdd={addEntry}
        onUpdate={updateEntry}
        onRemove={removeEntry}
      />
      {confirmingClear && (
        <ConfirmDialog
          title="Clear all data?"
          message={`This permanently deletes ALL entries saved for ${user}, in every month. Other users' entries are not affected. This cannot be undone.`}
          confirmLabel="Clear data"
          onConfirm={confirmClear}
          onCancel={() => setConfirmingClear(false)}
        />
      )}
    </div>
  );
}
</script>
  <script type="text/babel">
/* src/components/App.jsx */
// Auth gate: the login page until someone is signed in, then their calendar.
// Signing in and the list of users both come from the API.
function App() {
  const [session, setSession] = React.useState(null);              // { user, users } once signed in
  const [checking, setChecking] = React.useState(() => !!getToken()); // a token from this tab is being checked
  const [notice, setNotice] = React.useState("");                  // why the login page is showing, if not just "signed out"

  const start = (user, users) => {
    // Entries saved before accounts existed have no owner: the first user in the list adopts them.
    if (users.length && user.id === Math.min(...users.map((u) => u.id))) adoptLegacyEntries(user.username);
    setNotice("");
    setSession({ user, users });
  };

  // A page reload keeps the tab's token: check it with the API, and get the user list.
  React.useEffect(() => {
    setUnauthorizedHandler(() => {
      setSession(null);
      setNotice("Your session has ended. Please sign in again.");
    });
    if (!getToken()) return undefined;

    let cancelled = false;
    (async () => {
      try {
        const user = await restoreSession();
        const users = await loadUsers();
        if (!cancelled && user) start(user, users);
      } catch (e) {
        if (!cancelled && e.status !== 401) setNotice(e.message); // a 401 already said "session ended"
      } finally {
        if (!cancelled) setChecking(false);
      }
    })();
    return () => { cancelled = true; };
  }, []);

  // Resolves with null on success, or the reason it failed (shown on the login page).
  const login = async (username, password) => {
    const result = await loginUser(username, password);
    if (!result.ok) return result.error;
    clearView();                                    // a new sign-in starts on today's month
    start(result.user, await loadUsers());
    return null;
  };

  const logout = async () => {
    clearView();
    setSession(null);
    setNotice("");
    await logoutUser();
  };

  if (checking) {
    return <div className="auth-page"><p className="auth-note">Checking your session…</p></div>;
  }
  if (!session) return <LoginPage onLogin={login} notice={notice} />;
  // key: a different user always gets a fresh calendar (month, selection, open dialogs).
  return (
    <CalendarApp
      key={session.user.id}
      user={session.user.username}
      profile={session.user}
      users={session.users}
      onLogout={logout}
    />
  );
}
</script>
  <script type="text/babel">
/* src/main.jsx */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
